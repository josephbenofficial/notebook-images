<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>SQL HAVING pattern: aggregate first, then filter the summary rows</title><desc>Raw rows aggregate to one row per group, then a filter keeps only groups whose metric passes a threshold. Filtering happens after aggregation, never during.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<rect x="24" y="70" width="150" height="120" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="t" x="99" y="92" text-anchor="middle" fill="#2C2C2A">raw rows</text>
<rect x="38" y="104" width="122" height="18" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="99" y="117" text-anchor="middle" fill="#2C2C2A">A &#183; 100</text>
<rect x="38" y="126" width="122" height="18" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="99" y="139" text-anchor="middle" fill="#2C2C2A">B &#183; 200</text>
<rect x="38" y="148" width="122" height="18" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="99" y="161" text-anchor="middle" fill="#2C2C2A">A &#183; 150</text>
<rect x="38" y="170" width="122" height="18" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="99" y="183" text-anchor="middle" fill="#2C2C2A">C &#183; 50</text>
<text class="ts" x="220" y="108" text-anchor="middle">.groupby()</text>
<text class="ts" x="220" y="126" text-anchor="middle">.sum()</text>
<text class="ts" x="220" y="144" text-anchor="middle">.reset_index()</text>
<line x1="180" y1="165" x2="262" y2="165" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<rect x="266" y="70" width="170" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="351" y="92" text-anchor="middle" fill="#085041">summary table</text>
<text class="ts" x="280" y="110" text-anchor="start" fill="#085041">group_col &#183; metric</text>
<line x1="280" y1="116" x2="422" y2="116" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="280" y="122" width="142" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="351" y="136" text-anchor="middle" fill="#085041">A &#183; 330</text>
<rect x="280" y="146" width="142" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="351" y="160" text-anchor="middle" fill="#085041">B &#183; 200</text>
<rect x="280" y="170" width="142" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="351" y="184" text-anchor="middle" fill="#085041">C &#183; 50</text>
<text class="ts" x="470" y="116" text-anchor="middle">filter</text>
<text class="ts" x="470" y="134" text-anchor="middle">metric &gt; 100</text>
<line x1="440" y1="160" x2="500" y2="160" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<rect x="504" y="70" width="152" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="580" y="92" text-anchor="middle" fill="#085041">survivors</text>
<text class="ts" x="518" y="110" text-anchor="start" fill="#085041">group_col &#183; metric</text>
<line x1="518" y1="116" x2="644" y2="116" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="518" y="122" width="126" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="581" y="136" text-anchor="middle" fill="#085041">A &#183; 330 &#10003;</text>
<rect x="518" y="146" width="126" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="581" y="160" text-anchor="middle" fill="#085041">B &#183; 200 &#10003;</text>
<rect x="518" y="170" width="126" height="20" rx="3" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="581" y="184" text-anchor="middle" opacity="0.45">C &#183; 50 &#10007;</text>
<line x1="40" y1="222" x2="640" y2="222" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="t" x="340" y="248" text-anchor="middle">Two separate steps &#8212; you cannot filter inside the groupby.</text>
<text class="ts" x="340" y="270" text-anchor="middle">Step 1: aggregate to one row per group.   Step 2: filter that result like a normal DataFrame.</text>
<text class="ts" x="340" y="292" text-anchor="middle">SQL HAVING: WHERE filters raw rows before grouping, HAVING filters groups after.</text>
<text class="ts" x="340" y="314" text-anchor="middle">result = groupby().sum().reset_index()   &#8594;   result[result['metric'] &gt; threshold]</text>
</svg>
