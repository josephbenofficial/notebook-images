<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 465" width="1000" height="465" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="40" width="1000" height="465" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D85A30"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888780" stroke-width="2.5" opacity="0.28"/>
    </pattern>
  </defs>
  <rect x="60" y="60" width="880" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="500" y="89" font-size="13" fill="#1F2933" text-anchor="middle">full dataset, 9,994 rows</text>
  <path d="M 500 106 L 500 128" stroke="#888780" stroke-width="1.5" fill="none"/>
  <path d="M 405 128 L 865 128" stroke="#888780" stroke-width="1.5" fill="none"/>
  <path d="M 405 128 L 405 146" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 865 128 L 865 146" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="152" width="690" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.8"/>
  <text x="405" y="181" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle">X_train</text>
  <rect x="790" y="152" width="150" height="46" rx="6" fill="url(#hatch)" stroke="#888780" stroke-width="1.8" stroke-dasharray="5 3"/>
  <rect x="818" y="164" width="94" height="22" fill="#FFFFFF" opacity="0.88"/>
  <text x="865" y="181" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#888780" text-anchor="middle">X_test</text>
  <path d="M 160 198 L 160 244" stroke="#0F6E56" stroke-width="1.8" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="60" y="250" width="200" height="58" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
  <text x="160" y="274" font-size="12.5" fill="#1F2933" text-anchor="middle" font-weight="bold">cross-validation</text>
  <text x="160" y="293" font-size="10.5" fill="#888780" text-anchor="middle">5 folds, refit each time</text>
  <rect x="300" y="250" width="170" height="58" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
  <text x="385" y="274" font-size="12.5" fill="#1F2933" text-anchor="middle" font-weight="bold">tuning</text>
  <text x="385" y="293" font-size="10.5" fill="#888780" text-anchor="middle">grid search over folds</text>
  <rect x="510" y="250" width="240" height="58" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
  <text x="630" y="274" font-size="12.5" fill="#1F2933" text-anchor="middle" font-weight="bold">refit on all of train</text>
  <text x="630" y="293" font-size="10.5" fill="#888780" text-anchor="middle">the final model</text>
  <path d="M 260 279 L 294 279" stroke="#0F6E56" stroke-width="1.8" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M 470 279 L 504 279" stroke="#0F6E56" stroke-width="1.8" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="405" y="335" font-size="12" fill="#0F6E56" text-anchor="middle">model development stays inside the training path</text>
  <path d="M 865 198 L 865 374" stroke="#888780" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="878" y="250" font-size="11" fill="#888780">sealed</text>
  <text x="878" y="266" font-size="11" fill="#888780">not read,</text>
  <text x="878" y="282" font-size="11" fill="#888780">not fitted on</text>
  <path d="M 750 279 L 785 279 L 785 408 L 741 408" stroke="#0F6E56" stroke-width="1.8" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="735" y="380" width="205" height="56" rx="7" fill="#C0E8D3" stroke="#0F6E56" stroke-width="1.8"/>
  <text x="837" y="404" font-size="12.5" fill="#1F2933" text-anchor="middle" font-weight="bold">read once</text>
  <text x="837" y="423" font-size="10.5" fill="#888780" text-anchor="middle">section 9</text>
  <line x1="30" y1="462" x2="970" y2="462" stroke="#F1EFE8" stroke-width="2"/>
  <text x="30" y="486" font-size="12.5" fill="#1F2933">The busy path is the training half. The flat dashed line is the whole life of the test set.</text>
</svg>
