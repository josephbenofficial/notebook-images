<svg width="100%" viewBox="0 0 680 780" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>groupby + transform with rolling window</title>
<desc>Shows how groupby + transform with rolling(3).mean() scopes a sliding window within each group, resetting at group boundaries.</desc>
<defs>
  <pattern id="diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="4" y1="0" x2="4" y2="8" stroke="#185FA5" stroke-width="1.2" stroke-opacity="0.18"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8C8B85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="780" fill="#ffffff"/>

<rect x="40" y="14" width="600" height="28" rx="5" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<rect x="56" y="21" width="12" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="74" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Raw row</text>
<rect x="148" y="21" width="12" height="14" rx="2" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<text x="166" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Grouped object</text>
<rect x="278" y="21" width="12" height="14" rx="2" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="278" y="21" width="12" height="14" rx="2" fill="url(#diag)"/>
<text x="296" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Rolling window</text>
<text x="412" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">→</text>
<rect x="424" y="21" width="12" height="14" rx="2" fill="#C0E8D3" stroke="#0F6E56" stroke-width="0.5"/>
<text x="442" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Result (same shape)</text>

<rect x="40" y="52" width="600" height="28" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="66" font-size="10" font-family="'Courier New',Courier,monospace" fill="#185FA5" text-anchor="middle" dominant-baseline="central">df[&#39;new_col&#39;] = df.groupby(&#39;group_col&#39;)[&#39;value_col&#39;].transform(lambda x: x.rolling(3).mean())</text>

<text x="40" y="100" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Before &#8212; input DataFrame</text>

<!-- Input table fills (7 data rows + header) -->
<rect x="191" y="113" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="139" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="165" width="298" height="26" fill="#FAFAF8"/>
<rect x="191" y="191" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="217" width="298" height="26" fill="#FAFAF8"/>
<rect x="191" y="243" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="269" width="298" height="26" fill="#FAFAF8"/>
<rect x="191" y="295" width="298" height="26" fill="#F1EFE8"/>

<!-- Hatch overlay on group_col column -->
<rect x="252" y="113" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="139" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="165" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="191" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="217" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="243" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="269" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="295" width="98" height="26" fill="url(#diag)"/>

<!-- Row dividers -->
<line x1="191" y1="139" x2="489" y2="139" stroke="#888780" stroke-width="0.5"/>
<line x1="191" y1="165" x2="489" y2="165" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="191" x2="489" y2="191" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="217" x2="489" y2="217" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="243" x2="489" y2="243" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="269" x2="489" y2="269" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="295" x2="489" y2="295" stroke="#888780" stroke-width="0.3"/>

<!-- Column dividers -->
<line x1="251" y1="113" x2="251" y2="321" stroke="#888780" stroke-width="0.35"/>
<line x1="351" y1="113" x2="351" y2="321" stroke="#888780" stroke-width="0.35"/>

<!-- Input table text -->
<text x="221" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">row</text>
<text x="301" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">group_col</text>
<text x="420" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">value_col</text>
<text x="221" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">0</text>
<text x="301" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">10</text>
<text x="221" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">1</text>
<text x="301" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">20</text>
<text x="221" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2</text>
<text x="301" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">30</text>
<text x="221" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3</text>
<text x="301" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">40</text>
<text x="221" y="256" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">4</text>
<text x="301" y="256" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
<text x="420" y="256" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">100</text>
<text x="221" y="282" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">5</text>
<text x="301" y="282" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
<text x="420" y="282" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">110</text>
<text x="221" y="308" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6</text>
<text x="301" y="308" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
<text x="420" y="308" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">120</text>

<!-- Input table outer border -->
<rect x="190" y="112" width="300" height="210" rx="5" fill="none" stroke="#888780" stroke-width="1"/>


<line x1="40" y1="340" x2="294" y2="340" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="340" font-size="11" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">↓ transform</text>
<line x1="386" y1="340" x2="640" y2="340" stroke="#B4B2A9" stroke-width="0.5"/>


<!-- Group A box — Fix 2: solid fill + hatch overlay -->
<rect x="40" y="356" width="290" height="78" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="40" y="356" width="290" height="78" rx="6" fill="url(#diag)"/>
<text x="185" y="374" font-size="13" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Group A</text>
<text x="185" y="394" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">x = [10, 20, 30, 40]</text>
<text x="185" y="414" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">→ [NaN, NaN, 20.0, 30.0]</text>


<!-- Group B box — Fix 2: solid fill + hatch overlay -->
<rect x="350" y="356" width="290" height="78" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="350" y="356" width="290" height="78" rx="6" fill="url(#diag)"/>
<text x="495" y="374" font-size="13" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Group B</text>
<text x="495" y="394" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">x = [100, 110, 120]</text>
<text x="495" y="414" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">→ [NaN, NaN, 110.0]</text>


<!-- Arrow Set 1 — Fix 1: from bottom of each group's rows down to group box top -->
<!-- Arrow A: bottom of last A row (row 3) at y=243, group_col center x=301 → Group A box top (185, 356) -->
<line x1="301" y1="243" x2="185" y2="356" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>

<!-- Arrow B: bottom of last B row (row 6) at y=321, group_col center x=301 → Group B box top (495, 356) -->
<line x1="301" y1="321" x2="495" y2="356" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>



<line x1="40" y1="452" x2="296" y2="452" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="452" font-size="11" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">↓ map back</text>
<line x1="384" y1="452" x2="640" y2="452" stroke="#B4B2A9" stroke-width="0.5"/>


<text x="40" y="474" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">After &#8212; result (new_col)</text>

