<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 1000 396" width="1000" height="396" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
