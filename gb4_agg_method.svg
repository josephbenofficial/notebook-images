<text class="t" x="340" y="258" text-anchor="middle">Stage 3 &#8212; the trigger. The first line that actually computes anything.</text>
<text class="ts" x="340" y="280" text-anchor="middle">Each bucket &#8594; one value. group_col labels (A, B, C) become the INDEX, not a column.</text>
<text class="ts" x="340" y="302" text-anchor="middle">df.groupby('group_col')['value_col'].sum()   &#183;   add .reset_index() to make the index a column</text>
