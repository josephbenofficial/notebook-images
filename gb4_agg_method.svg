<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<rect x="30" y="64" width="210" height="140" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="135" y="88" text-anchor="middle" fill="#633806">SeriesGroupBy</text>
<text class="ts" x="135" y="106" text-anchor="middle" fill="#633806">lazy</text>
