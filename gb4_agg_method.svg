<rect x="540" y="146" width="90" height="22" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="585" y="161" text-anchor="middle" fill="#0C447C">500</text>
<rect x="436" y="172" width="80" height="22" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="476" y="187" text-anchor="middle" fill="#0C447C">C</text>
<rect x="540" y="172" width="90" height="22" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
