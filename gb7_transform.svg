<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>transform broadcasts each group's stat back to every original row</title><desc>transform computes a group statistic like agg, but instead of collapsing it maps the result back to every original row, so output length equals input length and it slots in as a new column.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<text class="t" x="95" y="62" text-anchor="middle">df</text>
<rect x="30" y="72" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="95" y="87" text-anchor="middle" fill="#2C2C2A">A &#183; 100</text>
<rect x="30" y="98" width="130" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="95" y="113" text-anchor="middle" fill="#0C447C">B &#183; 200</text>
<rect x="30" y="124" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="95" y="139" text-anchor="middle" fill="#2C2C2A">A &#183; 150</text>
<rect x="30" y="150" width="130" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="95" y="165" text-anchor="middle" fill="#712B13">C &#183; 50</text>
<rect x="30" y="176" width="130" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="95" y="191" text-anchor="middle" fill="#0C447C">B &#183; 300</text>
<rect x="30" y="202" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="95" y="217" text-anchor="middle" fill="#2C2C2A">A &#183; 80</text>
<text class="t" x="280" y="118" text-anchor="middle">.transform('sum')</text>
<text class="ts" x="280" y="135" text-anchor="middle">group sums: A=330 B=500 C=50</text>
<line x1="166" y1="150" x2="392" y2="150" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar_coral)"/>
<text class="ts" x="280" y="170" text-anchor="middle">broadcast back to each row</text>
<text class="t" x="500" y="62" text-anchor="middle">new column added</text>
<rect x="396" y="72" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="461" y="87" text-anchor="middle" fill="#2C2C2A">A &#183; 100</text>
<rect x="528" y="72" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="87" text-anchor="middle" fill="#712B13">330</text>
<rect x="396" y="98" width="130" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="461" y="113" text-anchor="middle" fill="#0C447C">B &#183; 200</text>
<rect x="528" y="98" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="113" text-anchor="middle" fill="#712B13">500</text>
<rect x="396" y="124" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="461" y="139" text-anchor="middle" fill="#2C2C2A">A &#183; 150</text>
<rect x="528" y="124" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="139" text-anchor="middle" fill="#712B13">330</text>
<rect x="396" y="150" width="130" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="461" y="165" text-anchor="middle" fill="#712B13">C &#183; 50</text>
<rect x="528" y="150" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="165" text-anchor="middle" fill="#712B13">50</text>
<rect x="396" y="176" width="130" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="461" y="191" text-anchor="middle" fill="#0C447C">B &#183; 300</text>
<rect x="528" y="176" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="191" text-anchor="middle" fill="#712B13">500</text>
<rect x="396" y="202" width="130" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="461" y="217" text-anchor="middle" fill="#2C2C2A">A &#183; 80</text>
<rect x="528" y="202" width="120" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="588" y="217" text-anchor="middle" fill="#712B13">330</text>
<line x1="40" y1="244" x2="640" y2="244" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="t" x="340" y="270" text-anchor="middle">6 rows in &#8594; 6 rows out.   agg collapses, transform broadcasts.</text>
<text class="ts" x="340" y="292" text-anchor="middle">Every row gets its OWN group's stat &#8212; A rows get 330, B rows get 500, C gets 50.</text>
<text class="ts" x="340" y="314" text-anchor="middle">No reset_index &#8212; same length as df, aligns straight in as a column.</text>
<text class="ts" x="340" y="336" text-anchor="middle">df['new_col'] = df.groupby('group_col')['value_col'].transform('sum')</text>
</svg>
