<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>Three paths out of groupby</title><desc>Single bracket shorthand gives one Series. Named agg gives only the columns you define. Transform is the only path that preserves every original row and column.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<text class="t" x="90" y="54" text-anchor="middle">Same input df</text>
<text class="t" x="340" y="54" text-anchor="middle">Syntax</text>
<text class="t" x="580" y="54" text-anchor="middle">What comes out</text>
<rect x="18" y="70" width="108" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="72" y="84" text-anchor="middle" fill="#0C447C">A &#183; ...</text>
<rect x="18" y="94" width="108" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="72" y="108" text-anchor="middle" fill="#0C447C">B &#183; ...</text>
<rect x="18" y="118" width="108" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="72" y="132" text-anchor="middle" fill="#0C447C">C &#183; ...</text>
<text class="t" x="255" y="86" text-anchor="middle">groupby('group_col')</text>
<text class="ts" x="255" y="103" text-anchor="middle">['value_col'].sum()</text>
<line x1="130" y1="116" x2="330" y2="116" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar_blue)"/>
<rect x="334" y="72" width="230" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
<text class="t" x="449" y="92" text-anchor="middle" fill="#0C447C">Series</text>
<text class="ts" x="449" y="110" text-anchor="middle" fill="#0C447C">1 col · 1 row per group</text>
<text class="ts" x="449" y="127" text-anchor="middle" fill="#0C447C">group_col becomes index</text>
<text class="ts" x="334" y="176" text-anchor="start">group_col + value_col only</text>
<rect x="18" y="188" width="108" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="72" y="202" text-anchor="middle" fill="#085041">A &#183; ...</text>
<rect x="18" y="212" width="108" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="72" y="226" text-anchor="middle" fill="#085041">B &#183; ...</text>
<rect x="18" y="236" width="108" height="20" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="72" y="250" text-anchor="middle" fill="#085041">C &#183; ...</text>
<text class="t" x="255" y="204" text-anchor="middle">groupby('group_col')</text>
<text class="ts" x="255" y="221" text-anchor="middle">.agg(m1=..., m2=...)</text>
<line x1="130" y1="234" x2="330" y2="234" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<rect x="334" y="190" width="230" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="449" y="210" text-anchor="middle" fill="#085041">DataFrame</text>
<text class="ts" x="449" y="228" text-anchor="middle" fill="#085041">named cols · 1 row per group</text>
<text class="ts" x="449" y="245" text-anchor="middle" fill="#085041">only what you defined</text>
<text class="ts" x="334" y="294" text-anchor="start">group_col + m1 + m2 only</text>
<rect x="18" y="306" width="108" height="20" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="72" y="320" text-anchor="middle" fill="#712B13">A &#183; ...</text>
<rect x="18" y="330" width="108" height="20" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="72" y="344" text-anchor="middle" fill="#712B13">B &#183; ...</text>
<rect x="18" y="354" width="108" height="20" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="72" y="368" text-anchor="middle" fill="#712B13">C &#183; ...</text>
<text class="t" x="255" y="322" text-anchor="middle">groupby('group_col')</text>
<text class="ts" x="255" y="339" text-anchor="middle">['value_col'].transform('sum')</text>
<line x1="130" y1="352" x2="330" y2="352" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar_coral)"/>
<rect x="334" y="308" width="230" height="80" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.0"/>
<text class="t" x="449" y="328" text-anchor="middle" fill="#712B13">df + new col</text>
<text class="ts" x="449" y="346" text-anchor="middle" fill="#712B13">all rows · all cols kept</text>
<text class="ts" x="449" y="363" text-anchor="middle" fill="#712B13">group stat on every row</text>
<text class="ts" x="334" y="412" text-anchor="start">full df + new col</text>
<line x1="18" y1="172" x2="662" y2="172" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="18" y1="290" x2="662" y2="290" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<rect x="18" y="392" width="644" height="38" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="t" x="38" y="408" text-anchor="start" fill="#2C2C2A">Rule: </text>
<text class="ts" x="94" y="408" text-anchor="start" fill="#2C2C2A">shorthand and agg both collapse rows &#8212; you only get the columns you ask for.</text>
<text class="ts" x="38" y="424" text-anchor="start" fill="#2C2C2A">transform is the only path that keeps every original row and every original column intact.</text>
</svg>
