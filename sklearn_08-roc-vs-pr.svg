<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 1000 418" width="1000" height="418" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="52" width="1000" height="418" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D85A30"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888780" stroke-width="2.5" opacity="0.28"/>
    </pattern>
  </defs>
  <rect x="100" y="92" width="320" height="268" fill="#FFFFFF" stroke="#888780" stroke-width="1.3"/>
  <path d="M 180 92 L 180 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 100 159 L 420 159" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 260 92 L 260 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 100 226 L 420 226" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 340 92 L 340 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 100 293 L 420 293" stroke="#F1EFE8" stroke-width="1"/>
  <text x="100" y="378" font-size="10" fill="#888780" text-anchor="middle">0</text>
  <text x="90" y="364" font-size="10" fill="#888780" text-anchor="end">0</text>
  <text x="260" y="378" font-size="10" fill="#888780" text-anchor="middle">0.5</text>
  <text x="90" y="230" font-size="10" fill="#888780" text-anchor="end">0.5</text>
  <text x="420" y="378" font-size="10" fill="#888780" text-anchor="middle">1</text>
  <text x="90" y="96" font-size="10" fill="#888780" text-anchor="end">1</text>
  <text x="260" y="398" font-size="11.5" fill="#1F2933" text-anchor="middle">false positive rate</text>
  <text x="66" y="226" font-size="11.5" fill="#1F2933" text-anchor="middle" transform="rotate(-90 66 226)">true positive rate</text>
  <text x="260" y="76" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold">ROC</text>
  <path d="M 100 360 L 420 92" stroke="#888780" stroke-width="1.8" fill="none" stroke-dasharray="7 5"/>
  <path d="M 100 360 C 140 182, 230 122, 420 92" stroke="#0F6E56" stroke-width="2.6" fill="none"/>
  <circle cx="260" cy="226" r="4.5" fill="#888780"/>
  <path d="M 260 226 L 378 326" stroke="#888780" stroke-width="1.1" fill="none"/>
  <text x="382" y="330" font-size="10.5" fill="#888780">baseline 0.50</text>
  <rect x="610" y="92" width="320" height="268" fill="#FFFFFF" stroke="#888780" stroke-width="1.3"/>
  <path d="M 690 92 L 690 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 610 159 L 930 159" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 770 92 L 770 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 610 226 L 930 226" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 850 92 L 850 360" stroke="#F1EFE8" stroke-width="1"/>
  <path d="M 610 293 L 930 293" stroke="#F1EFE8" stroke-width="1"/>
  <text x="610" y="378" font-size="10" fill="#888780" text-anchor="middle">0</text>
  <text x="600" y="364" font-size="10" fill="#888780" text-anchor="end">0</text>
  <text x="770" y="378" font-size="10" fill="#888780" text-anchor="middle">0.5</text>
  <text x="600" y="230" font-size="10" fill="#888780" text-anchor="end">0.5</text>
  <text x="930" y="378" font-size="10" fill="#888780" text-anchor="middle">1</text>
  <text x="600" y="96" font-size="10" fill="#888780" text-anchor="end">1</text>
  <text x="770" y="398" font-size="11.5" fill="#1F2933" text-anchor="middle">recall</text>
  <text x="576" y="226" font-size="11.5" fill="#1F2933" text-anchor="middle" transform="rotate(-90 576 226)">precision</text>
  <text x="770" y="76" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold">Precision-Recall</text>
  <path d="M 610 309.9 L 930 309.9" stroke="#888780" stroke-width="1.8" fill="none" stroke-dasharray="7 5"/>
  <circle cx="770" cy="309.9" r="4.5" fill="#888780"/>
  <text x="922" y="299.9" font-size="10.5" fill="#888780" text-anchor="end">baseline 0.187, the loss rate</text>
  <path d="M 610 118 C 700 132, 760 212, 930 295.9" stroke="#D85A30" stroke-width="2.6" fill="none"/>
  <text x="494" y="194" font-size="10.5" fill="#185FA5" text-anchor="middle">the random baseline changes</text>
  <text x="494" y="208" font-size="10.5" fill="#185FA5" text-anchor="middle">from 0.50 to 0.187</text>
  <path d="M 432 226 L 556 226 L 556 309.9 L 598 309.9" stroke="#185FA5" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>
  <line x1="60" y1="428" x2="940" y2="428" stroke="#F1EFE8" stroke-width="2"/>
  <text x="60" y="452" font-size="12.5" fill="#1F2933">One probability vector, two plots. The ROC baseline never moves; the PR baseline is whatever your positive rate happens to be.</text>
</svg>
