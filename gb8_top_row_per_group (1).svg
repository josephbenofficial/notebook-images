<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>Top row per group using transform max then filtering where metric equals the group max</title><desc>After aggregating to group totals, transform('max') broadcasts each group's maximum to every row, then a filter keeps only rows where the metric equals that maximum, leaving the top row per group.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<text class="t" x="105" y="60" text-anchor="middle">agg result</text>
<text class="ts" x="105" y="77" text-anchor="middle">one row per (group, item)</text>
<rect x="24" y="86" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="109" y="102" text-anchor="middle" fill="#085041">A &#183; item1 &#183; 330</text>
<rect x="24" y="112" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="109" y="128" text-anchor="middle" fill="#085041">A &#183; item2 &#183; 120</text>
<rect x="24" y="138" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="109" y="154" text-anchor="middle" fill="#085041">B &#183; item3 &#183; 500</text>
<rect x="24" y="164" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="109" y="180" text-anchor="middle" fill="#085041">B &#183; item4 &#183; 450</text>
<text class="t" x="305" y="100" text-anchor="middle">.transform('max')</text>
<text class="ts" x="305" y="120" text-anchor="middle">per-group max,</text>
<text class="ts" x="305" y="138" text-anchor="middle">broadcast to all rows</text>
<line x1="200" y1="160" x2="372" y2="160" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar_coral)"/>
<rect x="376" y="86" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="461" y="102" text-anchor="middle" fill="#085041">A &#183; item1 &#183; 330</text>
<rect x="550" y="86" width="100" height="24" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="600" y="102" text-anchor="middle" fill="#712B13">max 330</text>
<rect x="376" y="112" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="461" y="128" text-anchor="middle" fill="#085041">A &#183; item2 &#183; 120</text>
<rect x="550" y="112" width="100" height="24" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="600" y="128" text-anchor="middle" fill="#712B13">max 330</text>
<rect x="376" y="138" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="461" y="154" text-anchor="middle" fill="#085041">B &#183; item3 &#183; 500</text>
<rect x="550" y="138" width="100" height="24" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="600" y="154" text-anchor="middle" fill="#712B13">max 500</text>
<rect x="376" y="164" width="170" height="24" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="461" y="180" text-anchor="middle" fill="#085041">B &#183; item4 &#183; 450</text>
<rect x="550" y="164" width="100" height="24" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="600" y="180" text-anchor="middle" fill="#712B13">max 500</text>
<text class="t" x="300" y="214" text-anchor="middle">keep rows where  metric == group max</text>
<line x1="560" y1="200" x2="470" y2="250" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<rect x="120" y="250" width="360" height="92" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="300" y="272" text-anchor="middle" fill="#085041">top row per group</text>
<rect x="136" y="284" width="328" height="22" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="300" y="299" text-anchor="middle" fill="#085041">A &#183; item1 &#183; 330   (= max 330 &#10003;)</text>
<rect x="136" y="310" width="328" height="22" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="300" y="325" text-anchor="middle" fill="#085041">B &#183; item3 &#183; 500   (= max 500 &#10003;)</text>
<text class="ts" x="340" y="368" text-anchor="middle">item2 (120&#8800;330) and item4 (450&#8800;500) dropped &#8212; only the per-group winner survives.</text>
<text class="ts" x="340" y="388" text-anchor="middle">result[result['metric'] == result.groupby('group_col')['metric'].transform('max')]</text>
</svg>
