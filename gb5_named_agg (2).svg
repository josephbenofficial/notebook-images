<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>Named aggregation on multiple columns produces a MultiIndex DataFrame, then reset_index flattens it</title><desc>Grouping by two columns (group_col1 with values A,B and group_col2 with values X,Y) with named aggregations creates one row per group combination, indexed by the group columns. reset_index moves them back to regular columns.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<rect x="20" y="60" width="210" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="125" y="84" text-anchor="middle" fill="#633806">DataFrameGroupBy</text>
<text class="ts" x="125" y="102" text-anchor="middle" fill="#633806">groupby(['group_col1',</text>
<text class="ts" x="125" y="118" text-anchor="middle" fill="#633806">'group_col2'])</text>
<rect x="36" y="130" width="178" height="16" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="142" text-anchor="middle" fill="#633806">A · X bucket</text>
<rect x="36" y="148" width="178" height="16" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="160" text-anchor="middle" fill="#633806">A · Y bucket</text>
<rect x="36" y="166" width="178" height="16" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="178" text-anchor="middle" fill="#633806">B · X bucket</text>
<rect x="36" y="184" width="178" height="16" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="196" text-anchor="middle" fill="#633806">B · Y bucket</text>
<text class="t" x="320" y="96" text-anchor="middle">.agg(</text>
<text class="ts" x="320" y="114" text-anchor="middle">m1=('value_col1','sum')</text>
<text class="ts" x="320" y="132" text-anchor="middle">m2=('value_col2','mean')</text>
<text class="t" x="320" y="150" text-anchor="middle">)</text>
<line x1="236" y1="180" x2="404" y2="180" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar_blue)"/>
<rect x="408" y="60" width="248" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
<text class="t" x="532" y="82" text-anchor="middle" fill="#0C447C">DataFrame · MultiIndex</text>
<text class="ts" x="424" y="100" text-anchor="start" fill="#0C447C">(group_col1, group_col2) | m1 | m2</text>
<line x1="420" y1="108" x2="644" y2="108" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="420" y="114" width="224" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="532" y="128" text-anchor="middle" fill="#0C447C">(A, X) · 250 · 0.2</text>
<rect x="420" y="136" width="224" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="532" y="150" text-anchor="middle" fill="#0C447C">(A, Y) · 80 · 0.1</text>
<rect x="420" y="158" width="224" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="532" y="172" text-anchor="middle" fill="#0C447C">(B, X) · 410 · 0.4</text>
<rect x="420" y="180" width="224" height="20" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="532" y="194" text-anchor="middle" fill="#0C447C">(B, Y) · 130 · 0.3</text>
<text class="t" x="360" y="238" text-anchor="middle">.reset_index()</text>
<line x1="520" y1="212" x2="430" y2="252" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<rect x="150" y="258" width="380" height="128" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="340" y="280" text-anchor="middle" fill="#085041">DataFrame — group labels back as columns</text>
<text class="ts" x="166" y="300" text-anchor="start" fill="#085041">group_col1 | group_col2 | m1 | m2</text>
<line x1="166" y1="308" x2="514" y2="308" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="166" y="314" width="348" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="340" y="326" text-anchor="middle" fill="#085041">A · X · 250 · 0.2</text>
<rect x="166" y="332" width="348" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="340" y="344" text-anchor="middle" fill="#085041">A · Y · 80 · 0.1</text>
<rect x="166" y="350" width="348" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="340" y="362" text-anchor="middle" fill="#085041">B · X · 410 · 0.4</text>
<rect x="166" y="368" width="348" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="340" y="380" text-anchor="middle" fill="#085041">B · Y · 130 · 0.3</text>
</svg>
