<text class="ts" x="233" y="147" text-anchor="middle" fill="#712B13">max 150</text>
<text class="ts" x="300" y="147" text-anchor="start" fill="#0F6E56">keep ✓</text>
<rect x="20" y="160" width="150" height="26" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="95" y="177" text-anchor="middle" fill="#712B13">C · 50</text>
<rect x="178" y="160" width="110" height="26" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="233" y="177" text-anchor="middle" fill="#712B13">max 50</text>
<text class="ts" x="300" y="177" text-anchor="start" fill="#0F6E56">keep ✓</text>
<rect x="20" y="190" width="150" height="26" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="95" y="207" text-anchor="middle" fill="#0C447C">B · 300</text>
<rect x="178" y="190" width="110" height="26" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="233" y="207" text-anchor="middle" fill="#712B13">max 300</text>
<text class="ts" x="300" y="207" text-anchor="start" fill="#0F6E56">keep ✓</text>
<rect x="20" y="220" width="150" height="26" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="95" y="237" text-anchor="middle" fill="#2C2C2A">A · 80</text>
<rect x="178" y="220" width="110" height="26" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="233" y="237" text-anchor="middle" fill="#712B13">max 150</text>
<text class="ts" x="300" y="237" text-anchor="start" fill="#888780">drop ✗</text>
<text class="ts" x="150" y="266" text-anchor="middle">.groupby('group_col')['value_col'].transform('max')</text>
<line x1="95" y1="278" x2="95" y2="300" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar_teal)"/>
<text class="t" x="150" y="294" text-anchor="start">keep rows where  value == group max</text>
<rect x="20" y="306" width="360" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
<text class="t" x="200" y="328" text-anchor="middle" fill="#085041">top row per group</text>
<rect x="36" y="340" width="328" height="18" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="200" y="353" text-anchor="middle" fill="#085041">A · 150   (= max 150 ✓)</text>
<rect x="36" y="360" width="328" height="18" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="200" y="373" text-anchor="middle" fill="#085041">B · 300   (= max 300 ✓)  ·  C · 50 (= max 50 ✓)</text>
<text class="ts" x="410" y="316" text-anchor="start">result[</text>
<text class="ts" x="420" y="334" text-anchor="start">result['value_col'] ==</text>
<text class="ts" x="420" y="352" text-anchor="start">result.groupby('group_col')</text>
<text class="ts" x="430" y="370" text-anchor="start">['value_col'].transform('max')</text>
<text class="ts" x="410" y="388" text-anchor="start">]</text>
</svg>
