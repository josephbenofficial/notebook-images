<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>Single bracket narrows GroupBy to one column, returning a lazy SeriesGroupBy</title><desc>Indexing the GroupBy with a single-bracket column name narrows scope to one column and returns a still-lazy SeriesGroupBy.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<rect x="30" y="64" width="190" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="125" y="88" text-anchor="middle" fill="#633806">DataFrameGroupBy</text>
<text class="ts" x="125" y="106" text-anchor="middle" fill="#633806">all columns in scope</text>
<rect x="46" y="120" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="136" text-anchor="middle" fill="#633806">group_col</text>
<rect x="46" y="148" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="164" text-anchor="middle" fill="#633806">value_col</text>
<rect x="46" y="176" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="192" text-anchor="middle" fill="#633806">other_col</text>
<text class="t" x="320" y="118" text-anchor="middle">['value_col']</text>
<text class="ts" x="320" y="138" text-anchor="middle">single bracket</text>
<text class="ts" x="320" y="156" text-anchor="middle">narrows to one column</text>
<line x1="226" y1="180" x2="404" y2="180" stroke="#BA7517" stroke-width="1.5" marker-end="url(#ar_amber)"/>
<rect x="408" y="64" width="240" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="528" y="88" text-anchor="middle" fill="#633806">SeriesGroupBy</text>
<text class="ts" x="528" y="106" text-anchor="middle" fill="#633806">still lazy</text>
<rect x="424" y="120" width="208" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="136" text-anchor="middle" fill="#633806">A &#8594; 100, 150, 80</text>
<rect x="424" y="148" width="208" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="164" text-anchor="middle" fill="#633806">B &#8594; 200, 300</text>
<rect x="424" y="176" width="208" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="192" text-anchor="middle" fill="#633806">C &#8594; 50</text>
<text class="ts" x="340" y="250" text-anchor="middle">Stage 2 &#8212; only value_col is now in scope, grouped by group_col. Still no computation.</text>
<text class="ts" x="340" y="272" text-anchor="middle">Single bracket &#8594; SeriesGroupBy. The usual path: aggregate one column per group.</text>
<text class="ts" x="340" y="294" text-anchor="middle">df.groupby('group_col')['value_col']</text>
</svg>
