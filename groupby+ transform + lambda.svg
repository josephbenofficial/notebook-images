<svg width="100%" viewBox="0 0 680 700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>groupby + transform with element-wise diff</title>
<desc>Shows how groupby + transform with lambda x: x.diff() applies diff within each group, resetting at group boundaries.</desc>
<defs>
  <pattern id="diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="4" y1="0" x2="4" y2="8" stroke="#185FA5" stroke-width="1.2" stroke-opacity="0.18"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8C8B85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="700" fill="#ffffff"/>

<rect x="40" y="14" width="600" height="28" rx="5" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<rect x="56" y="21" width="12" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="74" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Raw row</text>
<rect x="148" y="21" width="12" height="14" rx="2" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<text x="166" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Grouped object</text>
<rect x="278" y="21" width="12" height="14" rx="2" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="278" y="21" width="12" height="14" rx="2" fill="url(#diag)"/>
<text x="296" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Series per group</text>
<text x="406" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">→</text>
<rect x="418" y="21" width="12" height="14" rx="2" fill="#C0E8D3" stroke="#0F6E56" stroke-width="0.5"/>
<text x="436" y="28" font-size="11" fill="#2C2C2A" dominant-baseline="central">Result (same shape)</text>

<rect x="40" y="52" width="600" height="28" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="66" font-size="12" font-family="'Courier New',Courier,monospace" fill="#185FA5" text-anchor="middle" dominant-baseline="central">df[&#39;new_col&#39;] = df.groupby(&#39;group_col&#39;)[&#39;value_col&#39;].transform(lambda x: x.diff())</text>

<text x="40" y="100" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Before &#8212; input DataFrame</text>

<!-- Input table fills -->
<rect x="191" y="113" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="139" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="165" width="298" height="26" fill="#FAFAF8"/>
<rect x="191" y="191" width="298" height="26" fill="#F1EFE8"/>
<rect x="191" y="217" width="298" height="26" fill="#FAFAF8"/>

<!-- Hatch overlay on group_col column (x=252, w=98) -->
<rect x="252" y="113" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="139" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="165" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="191" width="98" height="26" fill="url(#diag)"/>
<rect x="252" y="217" width="98" height="26" fill="url(#diag)"/>

<!-- Row dividers -->
<line x1="191" y1="139" x2="489" y2="139" stroke="#888780" stroke-width="0.5"/>
<line x1="191" y1="165" x2="489" y2="165" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="191" x2="489" y2="191" stroke="#888780" stroke-width="0.3"/>
<line x1="191" y1="217" x2="489" y2="217" stroke="#888780" stroke-width="0.3"/>

<!-- Column dividers -->
<line x1="251" y1="113" x2="251" y2="243" stroke="#888780" stroke-width="0.35"/>
<line x1="351" y1="113" x2="351" y2="243" stroke="#888780" stroke-width="0.35"/>

<!-- Input table text -->
<text x="221" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">row</text>
<text x="301" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">group_col</text>
<text x="420" y="126" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">value_col</text>
<text x="221" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">0</text>
<text x="301" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="152" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">100</text>
<text x="221" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">1</text>
<text x="301" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A</text>
<text x="420" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">130</text>
<text x="221" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2</text>
<text x="301" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
<text x="420" y="204" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">200</text>
<text x="221" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3</text>
<text x="301" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
<text x="420" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">250</text>

<!-- Input table outer border (last, on top) -->
<rect x="190" y="112" width="300" height="132" rx="5" fill="none" stroke="#888780" stroke-width="1"/>


<line x1="40" y1="262" x2="294" y2="262" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="262" font-size="11" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">↓ transform</text>
<line x1="386" y1="262" x2="640" y2="262" stroke="#B4B2A9" stroke-width="0.5"/>


<!-- Group A box — Fix 2: solid fill + hatch overlay -->
<rect x="40" y="278" width="290" height="66" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="40" y="278" width="290" height="66" rx="6" fill="url(#diag)"/>
<text x="185" y="296" font-size="13" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Group A</text>
<text x="185" y="316" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">x = [100, 130]</text>
<text x="185" y="336" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">→ [NaN, 30]</text>


<!-- Group B box — Fix 2: solid fill + hatch overlay -->
<rect x="350" y="278" width="290" height="66" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1"/>
<rect x="350" y="278" width="290" height="66" rx="6" fill="url(#diag)"/>
<text x="495" y="296" font-size="13" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Group B</text>
<text x="495" y="316" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">x = [200, 250]</text>
<text x="495" y="336" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">→ [NaN, 50]</text>


<!-- Arrow Set 1 — Fix 1: vertical/short from bottom of group rows to top of group boxes -->
<!-- Arrow A: from bottom of last A row (y=191) at group_col center (x=301) to Group A box top (185, 278) -->
<line x1="301" y1="191" x2="185" y2="278" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>

<!-- Arrow B: from bottom of last B row (y=243) at group_col center (x=301) to Group B box top (495, 278) -->
<line x1="301" y1="243" x2="495" y2="278" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>



<line x1="40" y1="362" x2="296" y2="362" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="362" font-size="11" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">↓ map back</text>
<line x1="384" y1="362" x2="640" y2="362" stroke="#B4B2A9" stroke-width="0.5"/>


<text x="40" y="384" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">After &#8212; result (new_col)</text>

<!-- Result table fills — Fix 4: header uses #A8DBBE -->
<rect x="271" y="397" width="138" height="26" fill="#A8DBBE"/>
<rect x="271" y="423" width="138" height="26" fill="#C0E8D3"/>
<rect x="271" y="449" width="138" height="26" fill="#E1F5EE"/>
<rect x="271" y="475" width="138" height="26" fill="#C0E8D3"/>
<rect x="271" y="501" width="138" height="26" fill="#E1F5EE"/>

<!-- Result table dividers -->
<line x1="271" y1="423" x2="409" y2="423" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="271" y1="449" x2="409" y2="449" stroke="#0F6E56" stroke-width="0.35"/>
<line x1="271" y1="475" x2="409" y2="475" stroke="#0F6E56" stroke-width="0.35"/>
<line x1="271" y1="501" x2="409" y2="501" stroke="#0F6E56" stroke-width="0.35"/>

<!-- Result table text -->
<text x="340" y="410" font-size="12" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">new_col</text>
<text x="340" y="436" font-size="12" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">NaN</text>
<text x="340" y="462" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">30</text>
<text x="340" y="488" font-size="12" fill="#8C8B85" text-anchor="middle" dominant-baseline="central">NaN</text>
<text x="340" y="514" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">50</text>

<!-- Result table outer border -->
<rect x="270" y="396" width="140" height="132" rx="5" fill="none" stroke="#0F6E56" stroke-width="0.5"/>

<!-- Arrow Set 2: from group box bottoms to result rows -->
<line x1="185" y1="344" x2="272" y2="436" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>

<line x1="495" y1="344" x2="408" y2="488" stroke="#8C8B85" stroke-dasharray="4,3" stroke-width="1" marker-end="url(#arr)"/>



<rect x="14" y="546" width="652" height="32" rx="4" fill="#FAECE7"/>
<rect x="14" y="546" width="4" height="32" rx="2" fill="#D85A30"/>
<polygon points="32,550 39,562 25,562" fill="#D85A30"/>
<text x="32" y="558" font-size="9" fill="#ffffff" text-anchor="middle" dominant-baseline="central">!</text>
<text x="50" y="562" font-size="12" fill="#712B13" dominant-baseline="central">NaN resets at each group boundary &#8212; diff() has no memory across groups</text>


<rect x="14" y="584" width="652" height="32" rx="4" fill="#FAECE7"/>
<rect x="14" y="584" width="4" height="32" rx="2" fill="#D85A30"/>
<polygon points="32,588 39,600 25,600" fill="#D85A30"/>
<text x="32" y="596" font-size="9" fill="#ffffff" text-anchor="middle" dominant-baseline="central">!</text>
<text x="50" y="600" font-size="12" fill="#712B13" dominant-baseline="central">First row of each group is always NaN &#8212; there is no previous row to diff against</text>

</svg>