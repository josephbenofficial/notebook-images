<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>Double bracket keeps table structure, returning a lazy DataFrameGroupBy</title><desc>Indexing the GroupBy with double brackets keeps it as a DataFrameGroupBy rather than collapsing to a SeriesGroupBy.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<rect x="30" y="64" width="190" height="140" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="125" y="88" text-anchor="middle" fill="#633806">DataFrameGroupBy</text>
<rect x="46" y="104" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="120" text-anchor="middle" fill="#633806">group_col</text>
<rect x="46" y="132" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="148" text-anchor="middle" fill="#633806">value_col</text>
<rect x="46" y="160" width="158" height="24" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="125" y="176" text-anchor="middle" fill="#633806">other_col</text>
<text class="t" x="320" y="112" text-anchor="middle">[['value_col']]</text>
<text class="ts" x="320" y="132" text-anchor="middle">double bracket</text>
<text class="ts" x="320" y="150" text-anchor="middle">keeps table shape</text>
<line x1="226" y1="174" x2="404" y2="174" stroke="#BA7517" stroke-width="1.5" marker-end="url(#ar_amber)"/>
<rect x="408" y="64" width="240" height="140" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text class="t" x="528" y="88" text-anchor="middle" fill="#633806">DataFrameGroupBy</text>
<text class="ts" x="528" y="106" text-anchor="middle" fill="#633806">one-column table per group</text>
<rect x="424" y="120" width="208" height="22" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="135" text-anchor="middle" fill="#633806">A &#8594; [[100],[150],[80]]</text>
<rect x="424" y="146" width="208" height="22" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="161" text-anchor="middle" fill="#633806">B &#8594; [[200],[300]]</text>
<rect x="424" y="172" width="208" height="22" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="ts" x="528" y="187" text-anchor="middle" fill="#633806">C &#8594; [[50]]</text>
<line x1="40" y1="232" x2="640" y2="232" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="340" y="258" text-anchor="middle">Stage 2, alternate path &#8212; the ONLY difference from single bracket is the output shape downstream.</text>
<text class="ts" x="340" y="280" text-anchor="middle">['value_col'] &#8594; aggregates to a Series   &#183;   [['value_col']] &#8594; aggregates to a DataFrame</text>
<text class="ts" x="340" y="302" text-anchor="middle">Use double brackets to keep the result a table. Both are still lazy here.</text>
</svg>
