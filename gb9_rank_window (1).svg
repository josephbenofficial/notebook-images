<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>transform rank is the pandas equivalent of SQL ROW_NUMBER OVER PARTITION BY</title><desc>transform('rank', ascending=False) numbers rows within each group by descending value, broadcasting a rank to every original row, the direct equivalent of a SQL window function.</desc>
<defs>
<marker id="ar_amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar_purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>.t{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}</style>
<rect x="40" y="14" width="600" height="26" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="52" y="22" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text class="ts" x="68" y="31" text-anchor="start">lazy</text>
<rect x="120" y="22" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="136" y="31" text-anchor="start">Series</text>
<rect x="206" y="22" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="222" y="31" text-anchor="start">DataFrame</text>
<rect x="320" y="22" width="10" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text class="ts" x="336" y="31" text-anchor="start">broadcast to all rows</text>
<text class="t" x="105" y="60" text-anchor="middle">df</text>
<rect x="30" y="72" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="105" y="87" text-anchor="middle" fill="#2C2C2A">A &#183; 100</text>
<rect x="30" y="98" width="150" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="105" y="113" text-anchor="middle" fill="#0C447C">B &#183; 200</text>
<rect x="30" y="124" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="105" y="139" text-anchor="middle" fill="#2C2C2A">A &#183; 150</text>
<rect x="30" y="150" width="150" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="105" y="165" text-anchor="middle" fill="#0C447C">B &#183; 300</text>
<rect x="30" y="176" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="105" y="191" text-anchor="middle" fill="#2C2C2A">A &#183; 80</text>
<text class="t" x="300" y="116" text-anchor="middle">.transform(</text>
<text class="ts" x="300" y="134" text-anchor="middle">'rank', ascending=False)</text>
<line x1="186" y1="150" x2="392" y2="150" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar_coral)"/>
<text class="ts" x="300" y="170" text-anchor="middle">rank within each group</text>
<text class="t" x="500" y="60" text-anchor="middle">rank column added</text>
<rect x="396" y="72" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="471" y="87" text-anchor="middle" fill="#2C2C2A">A &#183; 100</text>
<rect x="548" y="72" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="598" y="87" text-anchor="middle" fill="#712B13">rank 2</text>
<rect x="396" y="98" width="150" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="471" y="113" text-anchor="middle" fill="#0C447C">B &#183; 200</text>
<rect x="548" y="98" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="598" y="113" text-anchor="middle" fill="#712B13">rank 2</text>
<rect x="396" y="124" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="471" y="139" text-anchor="middle" fill="#2C2C2A">A &#183; 150</text>
<rect x="548" y="124" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="598" y="139" text-anchor="middle" fill="#712B13">rank 1</text>
<rect x="396" y="150" width="150" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="471" y="165" text-anchor="middle" fill="#0C447C">B &#183; 300</text>
<rect x="548" y="150" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="598" y="165" text-anchor="middle" fill="#712B13">rank 1</text>
<rect x="396" y="176" width="150" height="22" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="471" y="191" text-anchor="middle" fill="#2C2C2A">A &#183; 80</text>
<rect x="548" y="176" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="598" y="191" text-anchor="middle" fill="#712B13">rank 3</text>
<line x1="40" y1="218" x2="640" y2="218" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="t" x="340" y="244" text-anchor="middle">Within A: 150&#8594;1, 100&#8594;2, 80&#8594;3.   Within B: 300&#8594;1, 200&#8594;2.</text>
<text class="ts" x="340" y="266" text-anchor="middle">Like transform('sum') it broadcasts &#8212; same length as df, one rank per row. Filter rank==1 for the top row.</text>
<rect x="100" y="290" width="480" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="312" text-anchor="middle" fill="#26215C">SQL  &#8596;  pandas</text>
<text class="ts" x="120" y="334" text-anchor="start" fill="#26215C">ROW_NUMBER() OVER (PARTITION BY group_col ORDER BY value_col DESC)</text>
<text class="ts" x="120" y="356" text-anchor="start" fill="#26215C">groupby('group_col')['value_col'].transform('rank', ascending=False)</text>
</svg>
