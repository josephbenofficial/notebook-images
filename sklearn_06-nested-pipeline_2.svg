<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 1000 444" width="1000" height="444" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="36" width="1000" height="444" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6E56"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D85A30"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888780" stroke-width="2.5" opacity="0.28"/>
    </pattern>
  </defs>
  <rect x="50" y="80" width="900" height="312" rx="11" fill="#E7E6E4" stroke="#1F2933" stroke-width="2.4"/>
  <text x="72" y="110" font-size="14" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" font-weight="bold">Pipeline</text>
  <rect x="870" y="92" width="66" height="17" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="903" y="104" font-size="9" fill="#888780" text-anchor="middle">estimator</text>
  <rect x="78" y="130" width="536" height="234" rx="9" fill="#FFFFFF" stroke="#888780" stroke-width="1.8"/>
  <text x="98" y="158" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933"><tspan font-weight="bold">'preprocess'</tspan>  ColumnTransformer</text>
  <rect x="534" y="142" width="66" height="17" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="567" y="154" font-size="9" fill="#888780" text-anchor="middle">estimator</text>
  <rect x="100" y="176" width="240" height="168" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
  <text x="118" y="202" font-size="11.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#0F6E56" font-weight="bold">'num' Pipeline</text>
  <rect x="262" y="186" width="66" height="17" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="295" y="198" font-size="9" fill="#888780" text-anchor="middle">estimator</text>
  <rect x="118" y="216" width="204" height="34" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="220" y="238" font-size="10.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle">'impute'  SimpleImputer</text>
  <rect x="118" y="270" width="204" height="34" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="220" y="292" font-size="10.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle">'scale'  StandardScaler</text>
  <path d="M 220 250 L 220 264" stroke="#0F6E56" stroke-width="1.4" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="356" y="176" width="238" height="168" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
  <text x="374" y="202" font-size="11.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" font-weight="bold">'cat' Pipeline</text>
  <rect x="516" y="186" width="66" height="17" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="549" y="198" font-size="9" fill="#888780" text-anchor="middle">estimator</text>
  <rect x="374" y="216" width="202" height="34" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="1.1"/>
  <text x="475" y="238" font-size="10.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle">'encode'  OneHotEncoder</text>
  <text x="475" y="288" font-size="10" fill="#888780" text-anchor="middle">one step, but still a Pipeline,</text>
  <text x="475" y="304" font-size="10" fill="#888780" text-anchor="middle">so the address shape stays the same</text>
  <path d="M 614 247 L 656 247" stroke="#1F2933" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <rect x="662" y="196" width="260" height="102" rx="9" fill="#E8EFF6" stroke="#185FA5" stroke-width="1.8"/>
  <text x="792" y="228" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle" font-weight="bold">'model'</text>
  <text x="792" y="252" font-size="11" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1F2933" text-anchor="middle">RandomForestClassifier</text>
  <text x="792" y="278" font-size="10" fill="#888780" text-anchor="middle">the only step that knows the question</text>
  <rect x="842" y="206" width="66" height="17" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="875" y="218" font-size="9" fill="#888780" text-anchor="middle">estimator</text>
  <path d="M 500 392 L 500 414" stroke="#1F2933" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <text x="500" y="432" font-size="12.5" fill="#1F2933" text-anchor="middle" font-weight="bold">this border is the fitting boundary</text>
  <text x="500" y="452" font-size="12" fill="#1F2933" text-anchor="middle">one fit(X_train, y_train) call, and everything inside learns from those rows and nothing else</text>
  <text x="50" y="60" font-size="11" fill="#888780">every box below is itself an estimator, which is why they nest at all</text>
</svg>
